# =========================================================================
# CI/CD 流水线：测试 → 打包 → 存草稿（不发布）
#
# 三段串行，前一段失败即中断后续：
#   1) test     —— 版本号一致性 + ESLint + 快测（units/behavior）+ 构建前端 + 冒烟
#   2) package  —— electron-builder（--dir）+ Inno Setup 出安装包，上传 Actions 产物
#   3) draft    —— 把安装包、免安装 ZIP、源码 ZIP 挂到 GitHub Draft Release（draft=true，不对外发布）
#
# 触发：
#   · push 到 main / PR → 跑测试；只有非 PR 才继续打包与草稿（PR 省 CI 时长）
#   · workflow_dispatch → 手动全量跑一遍（同样只存草稿，不会发布）
#
# 打包总开关（2026-11-05 起默认关闭）：
#   · 仓库变量 PACKAGING_ENABLED —— 唯一开关，只有值等于 true 才跑 package / draft。
#   · 未设置该变量 = 关闭（当前状态）：push 只跑测试，打包与草稿两个 job 直接 skipped。
#   · 需要出安装包时再开（二选一）：
#       GitHub → Settings → Secrets and variables → Actions → Variables → New repository variable
#       名称 PACKAGING_ENABLED，值 true
#       或命令行：gh variable set PACKAGING_ENABLED --body true
#     用完想再关：把该变量删掉（删掉即回到关闭，别填 false 也算关闭，但删掉更干净）
#   · 测试段（test）不受影响，任何时候都会跑。
#
# 说明：
#   · 只支持 Windows：electron-builder 目标是 dir，安装包由 Inno Setup 编译。
#   · 原生模块（koffi / better-sqlite3-multiple-ciphers / sharp）使用 N-API 预编译产物，
#     electron-builder.json 里 npmRebuild:false，因此 CI 不需要 electron-rebuild。
#   · 应用内更新读 GitHub releases/latest，草稿不会成为 latest，用户侧不会收到更新。
# =========================================================================
name: CI/CD

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

# 同一分支的重复触发取消上一次，避免旧提交占着 Windows 机器
concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

# 默认只读；草稿发布任务单独申请 contents: write
permissions:
  contents: read

env:
  # 与 package.json 的 engines（>=22.12.0）对齐
  NODE_VERSION: '24'
  # 安装器编译器版本：Chocolatey/winget 目前只有 6.x，故在 CI 里装官方 7.x 安装包
  INNO_SETUP_VERSION: '7.1.1'

jobs:
  # ---------------------------------------------------------------- 1. 测试
  test:
    name: 测试
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            student-frontend/package-lock.json
            student-backend/package-lock.json

      - name: 安装依赖（主包；postinstall 会安装 student-backend 依赖）
        run: npm ci

      - name: 安装依赖（前端）
        working-directory: student-frontend
        run: npm ci

      - name: 版本号一致性（package.json ↔ Inno setup.iss）
        shell: pwsh
        run: |
          $pkg = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $match = Select-String -Path electron/inno/setup.iss -Pattern '#define MyAppVersion "([^"]+)"' | Select-Object -First 1
          if (-not $match) { throw 'electron/inno/setup.iss 中未找到 MyAppVersion 定义' }
          $iss = $match.Matches[0].Groups[1].Value
          if ($iss -ne $pkg) { throw "版本号不一致：package.json=$pkg，setup.iss=$iss（发版前需同步）" }
          if (-not (Test-Path 'electron/inno/ChineseSimplified.isl')) { throw '缺少 electron/inno/ChineseSimplified.isl（安装界面简体中文译文）' }
          Write-Host "版本号一致：$pkg"

      - name: ESLint 检查
        run: npm run lint

      - name: 错误边界检查（strict：空 catch 必须标注 best-effort 原因）
        run: npm run check:boundaries:strict

      # 生成物 ↔ 生成器对账：这三条过去只在本地手工跑，漂移进不了流水线（Q4-02/Q4-03/Q4-04）
      - name: IPC 策略生成物同源（没漂移）
        run: npm run check:ipc-policy

      - name: IPC 通道生成物同源（没漂移）
        run: npm run channels:gen -- --check

      - name: 数据库结构清单对账（空库 initSchema ↔ EXPECTED）
        run: npm run check:schema

      # 文档一致性与覆盖矩阵已清到 0 FAIL（2026-11-25）：死链/路径/计数/覆盖 4 格全绿，才挂进流水线。
      - name: 文档一致性校验（死链 / 覆盖 / 路由 / 计数）
        run: npm run docs:verify

      - name: 入口 × 不变量覆盖矩阵（GAP / UNKNOWN 必须为零）
        run: npm run check:coverage

      # 错误边界 strict 已清零（2026-11-25）：721 处存量逐条甄别——生成物假阳性 184 处由工具跳过、
      # 工具两个 bug（生成物未排除 / 同行注释识别用错行）修复后批量转绿、其余逐条读上下文标注具体原因，
      # 未发现需改代码的真吞错。空 catch 现在必须带 best-effort: 原因，新增静默捕获进不了流水线（Q4-02 G29 完成）。

      - name: 快测（单元 + 行为）
        run: npm test

      - name: 构建前端（冒烟用例依赖 dist 产物）
        run: npm run build

      - name: 冒烟测试
        shell: pwsh
        run: |
          # 安全通道 smoke 的断言页用裸 ESM import('/src/...')，只有 Vite 实时转译能跑，
          # dist 静态服务不行。CI 原先只 build 不启 Vite → 该用例永远 exit 3 被记成 SKIP，
          # 关键 401 重试回归从未在流水线跑过。这里构建后起 Vite，跑完 smoke 再停。
          # 前端端口取自唯一口径 ports.cjs（可被 FRONTEND_PORT 覆盖），不在这里写死
          $port = node -e "process.stdout.write(String(require('./config/ports.cjs').frontendPort))"
          $vite = Start-Process -FilePath node -ArgumentList 'student-frontend/dev-vite.js' -PassThru -WindowStyle Hidden
          try {
            $ready = $false
            for ($i = 0; $i -lt 60; $i++) {
              try {
                $r = Invoke-WebRequest -Uri "http://127.0.0.1:$port/" -UseBasicParsing -TimeoutSec 2
                if ($r.StatusCode -eq 200) { $ready = $true; break }
              } catch { Start-Sleep -Milliseconds 500 }
            }
            if (-not $ready) { throw 'Vite 开发服务器 30s 内未就绪，冒烟测试无法运行' }
            # 安全通道 401 重试是关键回归，SKIP 也必须算失败（--require-pass）
            npm run smoke -- --require-pass=secure-channel-retry
            if ($LASTEXITCODE -ne 0) { throw "冒烟测试失败（exit $LASTEXITCODE）" }
          } finally {
            if (-not $vite.HasExited) { Stop-Process -Id $vite.Id -Force }
          }

  # ---------------------------------------------------------------- 2. 打包
  package:
    name: 打包
    needs: test
    # 除了 PR 不出包，还要仓库变量 PACKAGING_ENABLED=true 才出包（默认未设 = 关闭）
    if: github.event_name != 'pull_request' && vars.PACKAGING_ENABLED == 'true'
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Node.js ${{ env.NODE_VERSION }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ env.NODE_VERSION }}
          cache: npm
          cache-dependency-path: |
            package-lock.json
            student-frontend/package-lock.json
            student-backend/package-lock.json

      # electron-builder 每次都要取 Electron 压缩包（配置里走 npmmirror），缓存能省数分钟
      - name: 缓存 Electron 二进制
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\electron\Cache
            ~\AppData\Local\electron-builder\Cache
          key: electron-${{ runner.os }}-${{ hashFiles('package-lock.json') }}
          restore-keys: |
            electron-${{ runner.os }}-

      - name: 安装依赖（主包；postinstall 会安装 student-backend 依赖）
        run: npm ci

      - name: 安装依赖（前端）
        working-directory: student-frontend
        run: npm ci

      # Vue 3.6 预览通道的依赖装在 student-frontend/vue36（只装 vue 一个包，
      # 主线 node_modules 里的 3.5 不受影响）。该目录的 package-lock.json 刻意不入库
      #（见 student-frontend/.gitignore），版本由 vue36/package.json 精确锁定 3.6.0-rc.15，
      # 所以这里用 npm install 而不是 npm ci。
      - name: 安装依赖（Vue 3.6 预览通道）
        run: npm install --prefix student-frontend/vue36 --no-audit --no-fund

      - name: 安装 Inno Setup 7 并定位 ISCC
        shell: pwsh
        run: |
          $ver = $env:INNO_SETUP_VERSION
          # 官方发布页 https://jrsoftware.org/isdl.php 的资产命名：tag=is-7_1_1，文件=innosetup-7.1.1-x64.exe
          $tag = 'is-' + ($ver -replace '\.', '_')
          $url = "https://github.com/jrsoftware/issrc/releases/download/$tag/innosetup-$ver-x64.exe"
          $installer = Join-Path $env:RUNNER_TEMP "innosetup-$ver-x64.exe"
          Write-Host "下载 Inno Setup $ver：$url"
          Invoke-WebRequest -Uri $url -OutFile $installer -UseBasicParsing
          $proc = Start-Process -FilePath $installer -ArgumentList '/VERYSILENT','/SUPPRESSMSGBOXES','/NORESTART' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Inno Setup 安装失败，退出码 $($proc.ExitCode)" }

          # 只认 7.x：优先标准安装目录，找不到再扫描 Program Files 下的 Inno Setup 7 目录
          $iscc = @(
            'C:\Program Files\Inno Setup 7\ISCC.exe',
            'C:\Program Files (x86)\Inno Setup 7\ISCC.exe'
          ) | Where-Object { Test-Path $_ } | Select-Object -First 1
          if (-not $iscc) {
            $iscc = Get-ChildItem 'C:\Program Files','C:\Program Files (x86)' -Directory -Filter 'Inno Setup 7' -ErrorAction SilentlyContinue |
              ForEach-Object { Join-Path $_.FullName 'ISCC.exe' } |
              Where-Object { Test-Path $_ } |
              Select-Object -First 1
          }
          if (-not $iscc) { throw '未找到 Inno Setup 7 的 ISCC.exe' }
          "INNO_SETUP_ISCC=$iscc" | Out-File -FilePath $env:GITHUB_ENV -Append
          Write-Host "ISCC：$iscc"

      # 不用 npm run electron:build：那条脚本没法只给 electron-builder 传 --publish never。
      # 展开写法必须自带 build:backend —— app.bundle.js 是 git 忽略的生成物，生产优先跑它；
      # 不显式重建会用工作区残留的旧 bundle，后端源码修复进不了包（electron:build 脚本里本就有这步）。
      # 两条通道顺序执行，输出目录互不覆盖：release/ 是 Vue 3.5 主线，release36/ 是 Vue 3.6 预览。
      - name: 打包正式版（前端 → 后端 bundle → electron-builder --dir → Inno Setup）
        run: |
          npm run build
          npm run build:backend
          # 显式关闭 electron-builder 在 CI 下的隐式发布（本流水线只出安装包，不发布）
          npx electron-builder --dir --publish never
          npm run build:win:inno

      # 必须排在正式版之后：3.6 构建会覆盖 student-frontend/dist，
      # 而正式版的产物此时已经复制进 release/win-unpacked 了。
      # --vue36 让 Inno 走预览通道分支：安装包名带 -Vue36、安装页多两行测试版提示。
      - name: 打包 Vue 3.6 预览版（同一套源码，Vue 3.6 + Vapor）
        run: |
          npm run build:new
          # 后端 bundle 与 Vue 通道无关，但这里也重建以自包含（单独重跑本步骤不会用旧 bundle）
          npm run build:backend
          npx electron-builder --dir --publish never --config.directories.output=release36
          npm run build:win:inno -- release36 --vue36

      - name: 校验安装包并生成 SHA-256
        shell: pwsh
        run: |
          foreach ($dir in @('release', 'release36')) {
            $exe = Get-ChildItem $dir -Filter '*-Setup-*.exe' -File | Select-Object -First 1
            if (-not $exe) { throw "未生成安装包（$dir/*-Setup-*.exe）" }
            # 两个包要挂在同一个 Release 下：预览版少了后缀就会和正式版同名互相覆盖
            if ($dir -eq 'release36' -and $exe.Name -notmatch 'Vue36') {
              throw "预览版安装包名缺少 -Vue36：$($exe.Name)（会与正式版撞名）"
            }
            $hash = (Get-FileHash -Path $exe.FullName -Algorithm SHA256).Hash.ToLower()
            "$hash  $($exe.Name)" | Out-File -FilePath "$($exe.FullName).sha256" -Encoding utf8
            Write-Host ("安装包：{0}（{1} MB）" -f $exe.FullName, [math]::Round($exe.Length / 1MB, 1))
          }

      # 免安装版：直接把两份 electron-builder 的 win-unpacked 各打成一个 zip
      - name: 制作免安装版（ZIP）并生成 SHA-256
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $sevenZip = @('C:\Program Files\7-Zip\7z.exe', 'C:\Program Files (x86)\7-Zip\7z.exe') |
            Where-Object { Test-Path $_ } | Select-Object -First 1
          $channels = @(
            @{ Dir = 'release/win-unpacked';   Zip = "release/ClassNest-Portable-$version-win-x64.zip" },
            @{ Dir = 'release36/win-unpacked'; Zip = "release36/ClassNest-Vue36-Portable-$version-win-x64.zip" }
          )
          foreach ($ch in $channels) {
            if (-not (Test-Path $ch.Dir)) { throw "未找到解包目录 $($ch.Dir)（electron-builder --dir 未成功？）" }
            # 归档根目录用英文应用名，解压后直接得到「ClassNest/ClassNest.exe」
            $stageRoot = Join-Path $env:RUNNER_TEMP ('portable-' + (Split-Path (Split-Path $ch.Dir -Parent) -Leaf))
            $stage = Join-Path $stageRoot 'ClassNest'
            Remove-Item $stageRoot -Recurse -Force -ErrorAction SilentlyContinue
            New-Item -ItemType Directory -Force $stage | Out-Null
            Copy-Item -Path (Join-Path $ch.Dir '*') -Destination $stage -Recurse -Force
            Remove-Item $ch.Zip -Force -ErrorAction SilentlyContinue
            # 优先 7-Zip（runner 预装，快且压缩率高），没有则退回系统自带的 Compress-Archive
            if ($sevenZip) {
              & $sevenZip a -tzip $ch.Zip $stageRoot -mx=5 -mmt=on | Out-Null
            } else {
              Compress-Archive -Path $stage -DestinationPath $ch.Zip -CompressionLevel Optimal
            }
            if (-not (Test-Path $ch.Zip)) { throw "免安装包生成失败：$($ch.Zip)" }
            $hash = (Get-FileHash -Path $ch.Zip -Algorithm SHA256).Hash.ToLower()
            "$hash  $(Split-Path $ch.Zip -Leaf)" | Out-File -FilePath "$($ch.Zip).sha256" -Encoding utf8
            Write-Host ("免安装包：{0}（{1} MB）" -f $ch.Zip, [math]::Round((Get-Item $ch.Zip).Length / 1MB, 1))
          }

      # 源码包：git archive 只打包被 Git 跟踪的文件，天然排除 node_modules / .env / 构建产物
      - name: 打包源码（ZIP）并生成 SHA-256
        shell: pwsh
        run: |
          $version = (Get-Content package.json -Raw | ConvertFrom-Json).version
          $zip = "release/ClassNest-Source-$version.zip"
          Remove-Item $zip -Force -ErrorAction SilentlyContinue
          git archive --format=zip "--prefix=classnest-$version/" -o $zip HEAD
          if ($LASTEXITCODE -ne 0 -or -not (Test-Path $zip)) { throw '源码包生成失败' }
          $hash = (Get-FileHash -Path $zip -Algorithm SHA256).Hash.ToLower()
          "$hash  $(Split-Path $zip -Leaf)" | Out-File -FilePath "$zip.sha256" -Encoding utf8
          Write-Host ("源码包：{0}（{1} MB）" -f $zip, [math]::Round((Get-Item $zip).Length / 1MB, 1))

      - name: 上传发布产物
        uses: actions/upload-artifact@v4
        with:
          name: classnest-release-assets
          path: |
            release/*-Setup-*.exe
            release/*-Setup-*.exe.sha256
            release/*-Portable-*.zip
            release/*-Portable-*.zip.sha256
            release/*-Source-*.zip
            release/*-Source-*.zip.sha256
            release36/*-Setup-*.exe
            release36/*-Setup-*.exe.sha256
            release36/*-Portable-*.zip
            release36/*-Portable-*.zip.sha256
          if-no-files-found: error
          retention-days: 7

  # ------------------------------------------------------------ 3. 存草稿
  draft:
    name: 存草稿（Draft Release，不发布）
    needs: package
    # 与 package 同一个开关：打包关了这里也就没有产物可挂，显式写一遍而不是依赖 needs 隐式跳过
    if: github.event_name != 'pull_request' && vars.PACKAGING_ENABLED == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - name: 检出代码（读取版本号）
        uses: actions/checkout@v4

      - name: 下载发布产物（安装包 / 免安装版 / 源码）
        uses: actions/download-artifact@v4
        with:
          name: classnest-release-assets
          path: artifacts

      # 只创建/更新草稿：已存在的正式发布不碰，避免「流水线自动发布」
      - name: 创建或更新草稿发布
        shell: bash
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set -euo pipefail
          VERSION=$(node -p "require('./package.json').version")
          TAG="v${VERSION}"
          echo "版本：${VERSION}，标签：${TAG}"
          ls -lhR artifacts

          # 产物来自 release/ 与 release36/ 两个子目录，下载到 artifacts/ 后保留层级。
          # 不写死某一层子目录：按扩展名递归收集，打包布局以后再变也不会漏匹配。
          mapfile -t ASSETS < <(find artifacts -type f \( -name '*.exe' -o -name '*.zip' -o -name '*.sha256' \) -print)
          if [ ${#ASSETS[@]} -eq 0 ]; then
            echo "::error::artifacts 下未找到任何可发布产物（exe/zip/sha256）"
            exit 1
          fi
          printf '待挂资产：\n'; printf '  %s\n' "${ASSETS[@]}"

          # 空字符串 = 该标签还没有任何发布
          EXISTS=$(gh release view "$TAG" --json isDraft --jq '.isDraft' 2>/dev/null || echo "")
          if [ -z "$EXISTS" ]; then
            gh release create "$TAG" \
              "${ASSETS[@]}" \
              --draft \
              --title "班集 v${VERSION}（草稿）" \
              --target "${GITHUB_SHA}" \
              --notes "自动构建的草稿版本，**尚未发布**（draft），不会推送给用户。

          - 版本：v${VERSION}
          - 提交：${GITHUB_SHA}
          - 流水线：${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}/actions/runs/${GITHUB_RUN_ID}
          - 资产：安装包（ClassNest-Setup-*.exe）、免安装版（ClassNest-Portable-*.zip）、源码（ClassNest-Source-*.zip），各附 SHA-256
          - Vue 3.6 预览版：ClassNest-Vue36-Setup-*.exe / ClassNest-Vue36-Portable-*.zip（同一套源码，仅前端框架换成 Vue 3.6 + Vapor；安装页与引导页会标注「仅供体验」，不建议作为主力版本）
          - 已通过：版本号一致性、ESLint、单元 + 行为快测、冒烟测试

          人工核对安装包与更新说明后，再在 GitHub 上手动发布。"
            echo "已创建草稿：$TAG"
          elif [ "$EXISTS" = "true" ]; then
            echo "草稿 $TAG 已存在，覆盖更新资产"
            gh release upload "$TAG" "${ASSETS[@]}" --clobber
          else
            echo "::warning::$TAG 已存在且已正式发布，按「不自动发布」原则跳过资产更新"
          fi
