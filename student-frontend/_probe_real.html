<!DOCTYPE html>
<html lang="zh">
<head><meta charset="UTF-8"><style>
  body { margin: 0; font: 13px system-ui; padding: 10px; }
  table { border-collapse: collapse; width: 320px; }
  td { padding: 6px 8px; border-bottom: 1px solid #cfd6e4; }
  td.handle { width: 20px; text-align: center; color: #888; }
  tr:nth-child(1) td { background: rgba(59,130,246,.05); }
  #out { position: fixed; left: 360px; top: 0; width: 520px; white-space: pre-wrap; font-family: monospace; font-size: 12px; }
</style></head>
<body>
<table id="tbl"><tbody data-gid="1">
  <tr data-mkey="a" data-index="0"><td class="handle">⠿</td><td>宿舍长</td></tr>
  <tr data-mkey="b" data-index="1"><td class="handle">⠿</td><td>成员 B</td></tr>
  <tr data-mkey="c" data-index="2"><td class="handle">⠿</td><td>成员 C</td></tr>
  <tr data-mkey="d" data-index="3"><td class="handle">⠿</td><td>成员 D</td></tr>
  <tr data-mkey="e" data-index="4"><td class="handle">⠿</td><td>成员 E</td></tr>
</tbody></table>
<div id="out"></div>
<script type="module">
import { applyRowShift, clearShift } from '/src/composables/tableDragFx.js'

const out = []
const say = (s) => out.push(s)

// ---------- 以下判定逻辑与 GroupManageView.vue 当前实现逐行一致 ----------
const ROW_DEAD = 5
let _memDrag = null
function memberRowAt(y) {
  const gs = _memDrag && _memDrag.geom
  if (!gs || !gs.length) return null
  const cur = _memDrag.rowAt
  let best = null
  let min = Infinity
  for (let i = 0; i < gs.length; i++) {
    const g = gs[i]
    if (!g) continue
    if (y >= g.top && y <= g.bottom) { best = i; break }
    const d = Math.min(Math.abs(y - g.top), Math.abs(y - g.bottom))
    if (d < min) { min = d; best = i }
  }
  if (best === null) return null
  if (cur !== null && cur !== undefined && cur !== best && gs[cur]) {
    const g = gs[cur]
    const away = y < g.top ? g.top - y : (y > g.bottom ? y - g.bottom : 0)
    if (away < ROW_DEAD) return cur
  }
  return best
}

const tbl = document.getElementById('tbl')
const tbody = tbl.querySelector('tbody')
const rows = Array.from(tbody.querySelectorAll('tr[data-mkey]'))
// 按下时缓存几何（同 onMemberHandleDown）
const geom = rows.map((r) => { const b = r.getBoundingClientRect(); return { top: b.top, bottom: b.bottom } })
const total = geom.reduce((s, r) => s + (r.bottom - r.top), 0)
const avgH = Math.round(total / rows.length)

function startDrag(fromIdx) {
  _memDrag = { fromGid: '1', fromIdx, rows, geom, avgH, draggedTo: fromIdx, rowAt: fromIdx }
  clearShift(tbody)
}

// 一帧：与 applyMemberMove 同组分支一致
function moveTo(y) {
  const d = _memDrag
  const under = document.elementFromPoint(180, y)
  const bodyEl = under && under.closest ? under.closest('tbody[data-gid]') : null
  if (!bodyEl) return { to: null, why: 'no-body' }
  if (String(bodyEl.dataset.gid) !== String(d.fromGid)) return { to: null, why: 'cross' }
  const to = memberRowAt(y)
  if (to === null) return { to: null, why: 'null' }
  d.rowAt = to
  let shifted = false
  if (to !== d.draggedTo) {
    d.draggedTo = to
    applyRowShift(d.rows, d.fromIdx, to, d.geom, d.avgH)
    shifted = true
  }
  return { to, shifted }
}

window.__run = () => {
  say('行高实测：' + (geom[0].bottom - geom[0].top).toFixed(3) + 'px  首行 top=' + geom[0].top.toFixed(2))
  say('行边界：' + rows.map((r, i) => i + ':' + (geom[i].bottom - geom[0].top).toFixed(2)).join('  '))
  say('')

  // 场景 A：鼠标停在「第 2 行 / 第 3 行」交界处上下晃 ±3px（20 帧）
  const edge = geom[2].top // 第 3 行的上边界 = 第 2/3 行交界
  const jitter = []
  for (let i = 0; i < 20; i++) jitter.push(Math.round(edge + (i % 2 === 0 ? -3 : 3)))

  startDrag(1)
  const seqA = []
  let shiftA = 0
  for (const y of jitter) { const r = moveTo(y); seqA.push(r.to); if (r.shifted) shiftA++ }

  say('场景 A：拖第 2 行，鼠标停在第 2/3 行交界上下晃 ±3px（20 帧）')
  say('  目标行序列 = ' + seqA.join(','))
  say('  唯一值 = {' + [...new Set(seqA)].join(',') + '}   让位触发次数 = ' + shiftA +
    (new Set(seqA).size === 1 ? '   ✅ 完全稳定' : '   ← 仍在切换'))
  say('')

  // 场景 B：真的往下拖到第 4 行（应该逐行切换，不回头）
  startDrag(1)
  const sweep = []
  for (let y = geom[1].top + 4; y <= geom[4].top + 10; y += 4) sweep.push(Math.round(y))
  const seqB = []
  let shiftB = 0
  for (const y of sweep) { const r = moveTo(y); seqB.push(r.to); if (r.shifted) shiftB++ }
  say('场景 B：从第 2 行真的往下拖到第 5 行（' + sweep.length + ' 帧）')
  say('  目标行序列 = ' + seqB.join(','))
  say('  切换次数 = ' + shiftB + (shiftB <= 3 ? '   ✅ 单调往下，不回头' : '   ← 来回跳'))
  say('')

  // 场景 C：横向晃动（x 变、y 不变）—— 判定只看 y，应完全不受影响
  startDrag(1)
  const yFixed = Math.round((geom[1].top + geom[1].bottom) / 2)
  const seqC = []
  for (let i = 0; i < 10; i++) {
    const under = document.elementFromPoint(60 + i * 20, yFixed)
    const bodyEl = under && under.closest ? under.closest('tbody[data-gid]') : null
    seqC.push(bodyEl ? memberRowAt(yFixed) : 'X')
  }
  say('场景 C：x 左右移动、y 不变（10 帧，鼠标扫过拖拽柄/序号/成员/备注各列）')
  say('  目标行序列 = ' + seqC.join(','))
  say('  唯一值 = {' + [...new Set(seqC)].join(',') + '}' +
    (new Set(seqC).size === 1 ? '   ✅ 横向移动不影响判定' : '   ← 横向移动会改变目标行！'))

  clearShift(tbody)
  document.getElementById('out').textContent = out.join('\n')
}
</script>
</body>
</html>
