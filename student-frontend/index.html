<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8">
    <!-- 说明：改这个文件会让 Vite 对已开着的窗口发一次 full-reload。
         调 UI 时若组件级 HMR 没生效（应用关窗口只是收进托盘，页面并不重载），改这里可强制刷新。
         最新触发：2026-11-01 06:40 回退表头宽度联动（auto 布局会连锁重排）。 -->
    <link rel="icon" type="image/webp" href="/logo.webp">

    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <link rel="preconnect" href="http://localhost:3000">
    <!-- 注意：这里不要手写 <link rel="modulepreload" href="/src/main.js">。
         构建时它会被解析成一个独立 chunk（与真正入口 chunk 不同名），
         导致启动多下载一个无人使用的小 chunk；入口及其静态依赖的 modulepreload
         由 Vite 构建时自动注入（见构建产物的 index.html），无需手写。 -->
    
    <title>班集</title>
    <!--splash-css-->
    <style>
      /* 首屏占位的基础兜底：占位自身带不透明渐变底（见 splash/splash.css），
         这里给 body 一层同色兜底，窗口出现的瞬间即无白屏。 */
      html, body { margin: 0; height: 100%; }
      body { background: linear-gradient(160deg, #eef2ff 0%, #e2e8ff 100%); }
      /* 深色模式兜底底色：与 splash.css 的深色占位同一取色（glass 夜间底），
         避免占位页移除、Vue 首屏尚未接管时闪一下浅色。判定口径同 src/stores/theme.js。 */
      :root[data-mode="night"]:is([data-theme="glass"], [data-theme="glass2"]) body { background: #182238; }
    </style>
  </head>
  <body>
    <div id="app">
      <!--splash-html-->
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
