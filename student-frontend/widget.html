<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>小组件</title>
  <style>
    * { user-select: none; -webkit-user-select: none; }
    /* 本窗口是悬浮在桌面上的全透明窗口，只有工具箱面板自身有底色。
       主题层会往 body / body::before / body::after 铺页面底色、背景图与光斑
       （glass 的底图、glass2 的光斑），这里全部压掉，避免整窗被铺成一块不透明矩形。 */
    html, body { margin: 0; padding: 0; overflow: hidden; width: 100%; height: 100%; background: transparent !important; }
    body::before, body::after { content: none !important; }
    /* 工具箱图标(.fab)和菜单(.menu-panel)都是 absolute 定位，脱离 flex 流后
       没人撑开 .widget-wrapper；必须让挂载点有确定高度，wrapper 的 height:100% 才生效，
       否则 wrapper 坍缩、overflow:hidden 把图标和菜单裁成一条。 */
    #widget-app { height: 100%; }
  </style>
</head>
<body>
  <div id="widget-app"></div>
  <script type="module" src="/src/subwindows/widget/main.js"></script>
</body>
</html>
